# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mantener mínimo de conexiones inactivas en 0, permitir que el pool se encoja
spring.datasource.hikari.minimum-idle=0

# Tiempo de espera de inactividad (milisegundos), cerrar conexiones inactivas lo antes posible
spring.datasource.hikari.idle-timeout=60000

# Se recomienda establecerlo entre 10-15 minutos
spring.datasource.hikari.max-lifetime=900000